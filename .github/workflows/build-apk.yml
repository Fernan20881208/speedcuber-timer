name: Build Zaid Speedcube Timer APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Yarn Classic
        run: |
          npm install --global yarn@1.22.22

          echo "Node:"
          node --version

          echo "Yarn:"
          yarn --version

          echo "Java:"
          java -version

      - name: Show Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          which java
          java -version

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install required Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "ndk;23.1.7779620"

      - name: Verify Android SDK components
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$ANDROID_HOME/build-tools/33.0.0"
          test -d "$ANDROID_HOME/ndk/23.1.7779620"

          echo "Android SDK 36 OK"
          echo "Android SDK 33 OK"
          echo "Build Tools 33.0.0 OK"
          echo "NDK 23.1.7779620 OK"

      - name: Install JavaScript dependencies
        run: |
          yarn install \
            --frozen-lockfile \
            --network-timeout 600000

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Verify Gradle
        working-directory: android
        run: ./gradlew --version

      - name: Create release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/speedcuber-release.keystore" \
            -storepass speedcuber123 \
            -keypass speedcuber123 \
            -alias speedcuber \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Zaid Speedcube Timer, OU=GitHub Actions, O=Zaid, L=Guadalajara, ST=Jalisco, C=MX"

          test -f "$RUNNER_TEMP/speedcuber-release.keystore"

      - name: Build standalone Release APK
        id: gradle_build
        continue-on-error: true
        working-directory: android
        env:
          ANDROID_RELEASE_KEYSTORE_FILE_PATH: ${{ runner.temp }}/speedcuber-release.keystore
          ANDROID_RELEASE_KEYSTORE_PASSWORD: speedcuber123
          ANDROID_RELEASE_KEY_ALIAS: speedcuber
          ANDROID_RELEASE_KEY_PASSWORD: speedcuber123
        shell: bash
        run: |
          mkdir -p ../output
          set -o pipefail

          ./gradlew \
            assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../output/gradle-build.log

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zaid-Speedcube-Gradle-Log
          path: output/gradle-build.log
          if-no-files-found: error
          retention-days: 30

      - name: Collect React Native crash symbols
        if: always()
        shell: bash
        run: |
          mkdir -p output/js-symbols

          echo "Git commit:"
          git rev-parse HEAD | tee output/js-symbols/git-commit.txt

          echo
          echo "Searching generated React Native bundles and source maps..."

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            REL="${FILE#android/app/build/}"
            mkdir -p "output/js-symbols/$(dirname "$REL")"
            cp "$FILE" "output/js-symbols/$REL"
          done < <(
            find android/app/build \
              -type f \
              \( -name "*.map" -o -name "index.android.bundle" \) \
              2>/dev/null
          )

          echo
          echo "Collected files:"
          find output/js-symbols -type f -print || true

      - name: Upload React Native crash symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zaid-Speedcube-JS-Symbols
          path: output/js-symbols
          if-no-files-found: warn
          retention-days: 30

      - name: Mark build as failed
        if: steps.gradle_build.outcome == 'failure'
        run: |
          echo "Gradle build failed. Download Zaid-Speedcube-Gradle-Log for the complete error."
          exit 1

      - name: Find generated APK
        if: success()
        run: |
          echo "Generated APK files:"
          find android/app/build/outputs -type f -name "*.apk" -print

      - name: Copy APK
        if: success()
        shell: bash
        run: |
          APK="$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated"
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/Zaid-Speedcube-Timer.apk

          echo "Final APK:"
          ls -lh output/Zaid-Speedcube-Timer.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zaid-Speedcube-Timer-Release-APK
          path: output/Zaid-Speedcube-Timer.apk
          if-no-files-found: error
          retention-days: 30
