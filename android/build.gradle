// Top-level build file where you can add configuration options
// common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "33.0.0"

        // Liquid Glass requires Android 7.0+
        minSdkVersion = 24

        // AndroidX Core 1.13.1 brought by Liquid Glass requires API 34+.
        // Use the minimum compatible compile SDK to stay as close as possible
        // to the React Native 0.71 / AGP 7.3.1 toolchain.
        compileSdkVersion = 34

        // Keep the original runtime target behavior for now.
        targetSdkVersion = 33

        // Keep the original NDK. Liquid Glass is consumed as a prebuilt AAR.
        ndkVersion = "23.1.7779620"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath(
            "com.android.tools.build:gradle:7.3.1"
        )

        classpath(
            "com.facebook.react:react-native-gradle-plugin"
        )
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()

        // Liquid Glass is published through JitPack.
        maven {
            url "https://jitpack.io"
        }
    }
}
