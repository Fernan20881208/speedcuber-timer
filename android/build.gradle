// Top-level build file where you can add configuration options
// common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "33.0.0"

        // Liquid Glass requiere Android 7.0+
        minSdkVersion = 24

        // Conservamos el toolchain original de React Native 0.71
        compileSdkVersion = 33
        targetSdkVersion = 33

        // Conservamos el NDK original de Speedcuber Timer.
        // Liquid Glass viene como AAR ya compilado.
        ndkVersion = "23.1.7779620"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath(
            "com.android.tools.build:gradle:7.3.1"
        )

        classpath(
            "com.facebook.react:react-native-gradle-plugin"
        )
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()

        // Necesario para:
        // com.github.QWEA0:liquidglass:v2.0.2
        maven {
            url "https://jitpack.io"
        }
    }
}
