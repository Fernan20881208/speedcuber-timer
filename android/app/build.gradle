apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

apply from: './versionCode.gradle'
apply from: './versionName.gradle'
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

import com.android.build.OutputFile
import org.apache.tools.ant.taskdefs.condition.Os

/**
 * React Native configuration.
 */
react {
    /* Folders */
    // root = file("../")
    // reactNativeDir = file("../node_modules/react-native")
    // codegenDir = file("../node_modules/react-native-codegen")
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    // nodeExecutableAndArgs = ["node"]
    // bundleCommand = "ram-bundle"
    // bundleConfig = file(../rn-cli.config.js)
    // bundleAssetName = "MyApplication.android.bundle"
    // entryFile = file("../js/MyApplication.android.js")
    // extraPackagerArgs = []

    /* Hermes */
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"

    // React Native 0.71 ya usa por defecto:
    // -O
    // -output-source-map
    //
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Generate separate APKs per architecture.
 */
def enableSeparateBuildPerCPUArchitecture = false

/**
 * Enable Proguard for release.
 */
def enableProguardInReleaseBuilds = false

/**
 * JavaScriptCore flavor used when Hermes is disabled.
 */
def jscFlavor =
        'org.webkit:android-jsc-intl:+'

/**
 * Native architectures.
 */
def reactNativeArchitectures() {
    def value =
            project
                    .getProperties()
                    .get(
                            "reactNativeArchitectures"
                    )

    return value
            ? value.split(",")
            : [
                "armeabi-v7a",
                "x86",
                "x86_64",
                "arm64-v8a"
            ]
}

android {
    ndkVersion rootProject.ext.ndkVersion

    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "org.speedcuber.timer"

    defaultConfig {
        applicationId "org.speedcuber.timer"

        minSdkVersion rootProject.ext.minSdkVersion

        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode Integer.parseInt(
                VERSION_CODE
        )

        versionName VERSION_NAME
    }

    splits {
        abi {
            reset()

            enable enableSeparateBuildPerCPUArchitecture

            universalApk false

            include(
                    *reactNativeArchitectures()
            )
        }
    }

    signingConfigs {
        debug {
            storeFile file(
                    'debug.keystore'
            )

            storePassword 'android'

            keyAlias 'androiddebugkey'

            keyPassword 'android'
        }

        release {
            def keystorePath =
                    System.getenv(
                            "ANDROID_RELEASE_KEYSTORE_FILE_PATH"
                    )

            if (
                    keystorePath != null &&
                    keystorePath.length() > 0
            ) {
                storeFile file(
                        System.getenv(
                                "ANDROID_RELEASE_KEYSTORE_FILE_PATH"
                        )
                )

                storePassword System.getenv(
                        "ANDROID_RELEASE_KEYSTORE_PASSWORD"
                )

                keyAlias System.getenv(
                        "ANDROID_RELEASE_KEY_ALIAS"
                )

                keyPassword System.getenv(
                        "ANDROID_RELEASE_KEY_PASSWORD"
                )
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release

            minifyEnabled enableProguardInReleaseBuilds

            proguardFiles(
                    getDefaultProguardFile(
                            "proguard-android.txt"
                    ),
                    "proguard-rules.pro"
            )
        }
    }

    applicationVariants.all {
        variant ->

        variant.outputs.each {
            output ->

            def versionCodes = [
                    "armeabi-v7a": 1,
                    "x86": 2,
                    "arm64-v8a": 3,
                    "x86_64": 4
            ]

            def abi =
                    output.getFilter(
                            OutputFile.ABI
                    )

            if (abi != null) {
                output.versionCodeOverride =
                        defaultConfig.versionCode * 1000 +
                        versionCodes.get(
                                abi
                        )
            }
        }
    }
}

dependencies {
    /**
     * React Native
     */
    implementation(
            "com.facebook.react:react-android"
    )

    /**
     * Zaid Liquid Glass
     *
     * Official JitPack artifact:
     * com.github.QWEA0:liquidglass:v2.0.2
     */
    implementation(
            "com.github.QWEA0:liquidglass:v2.0.2"
    )

    /**
     * AndroidX dependencies
     */
    implementation(
            "androidx.swiperefreshlayout:swiperefreshlayout:1.0.0"
    )

    implementation(
            "androidx.core:core-splashscreen:1.0.0"
    )

    /**
     * Flipper - Debug builds only
     */
    debugImplementation(
            "com.facebook.flipper:flipper:${FLIPPER_VERSION}"
    )

    debugImplementation(
            "com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}"
    ) {
        exclude group: 'com.squareup.okhttp3',
                module: 'okhttp'
    }

    debugImplementation(
            "com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}"
    )

    /**
     * Hermes / JavaScriptCore
     */
    if (
            hermesEnabled.toBoolean()
    ) {
        implementation(
                "com.facebook.react:hermes-android"
        )
    } else {
        implementation jscFlavor
    }
}

apply from:
        file(
                "../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"
        )

applyNativeModulesAppBuildGradle(
        project
)
