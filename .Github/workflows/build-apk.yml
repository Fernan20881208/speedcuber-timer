name: Build Speedcuber Timer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Java 17 es necesario para el sdkmanager actual.
      # Gradle 7.5.1 también soporta Java 17.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # El proyecto especifica Node 18 en .node-version
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: yarn
          cache-dependency-path: yarn.lock

      # El yarn.lock del proyecto es Yarn Classic / v1.
      # No usamos Corepack para evitar que seleccione Yarn moderno.
      - name: Install Yarn Classic
        run: |
          npm install --global yarn@1.22.22
          node --version
          npm --version
          yarn --version
          java -version

      - name: Show Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          which java
          java -version

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      # Versiones EXACTAS declaradas en android/build.gradle
      - name: Install required Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "ndk;23.1.7779620"

      - name: Verify Android SDK components
        run: |
          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$ANDROID_HOME/build-tools/33.0.0"
          test -d "$ANDROID_HOME/ndk/23.1.7779620"

          echo "Android SDK 33 OK"
          echo "Build Tools 33.0.0 OK"
          echo "NDK 23.1.7779620 OK"

      - name: Install JavaScript dependencies
        run: |
          yarn install \
            --frozen-lockfile \
            --network-timeout 600000

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Verify Gradle
        working-directory: android
        run: |
          ./gradlew --version

      # El build.gradle original exige variables ANDROID_RELEASE_*
      # para firmar Release.
      #
      # Creamos una keystore propia para este APK.
      - name: Create release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/speedcuber-release.keystore" \
            -storepass speedcuber123 \
            -keypass speedcuber123 \
            -alias speedcuber \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Speedcuber Timer, OU=GitHub Actions, O=Local Build, L=Guadalajara, ST=Jalisco, C=MX"

          test -f "$RUNNER_TEMP/speedcuber-release.keystore"

      # Release incluye el bundle JS.
      # Limito a arm64-v8a para teléfonos Android modernos.
      - name: Build standalone Release APK
        working-directory: android
        env:
          ANDROID_RELEASE_KEYSTORE_FILE_PATH: ${{ runner.temp }}/speedcuber-release.keystore
          ANDROID_RELEASE_KEYSTORE_PASSWORD: speedcuber123
          ANDROID_RELEASE_KEY_ALIAS: speedcuber
          ANDROID_RELEASE_KEY_PASSWORD: speedcuber123
        run: |
          ./gradlew \
            assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon \
            --stacktrace

      - name: Find generated APK
        run: |
          echo "Generated APK files:"
          find android/app/build/outputs -type f -name "*.apk" -print

      - name: Copy APK
        run: |
          APK="$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated"
            exit 1
          fi

          echo "APK=$APK"

          mkdir -p output
          cp "$APK" output/Speedcuber-Timer-v0.2.4-arm64.apk

          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Speedcuber-Timer-Release-APK
          path: output/Speedcuber-Timer-v0.2.4-arm64.apk
          if-no-files-found: error
          retention-days: 30
